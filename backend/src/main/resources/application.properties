spring.application.name=psiqueup-api
server.port=8080
server.forward-headers-strategy=native

# Importa variaveis locais de desenvolvimento sem versionar segredos (.env no .gitignore)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Conexão com o PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/psiqueup_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA (apenas valida se as entidades batem com o SQL do Flyway)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Flyway (controle de versao do banco)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Configuracoes JWT, Refresh Token, Cookies, LGPD (CPF HMAC) e CORS
api.security.token.secret=${JWT_SECRET}
api.security.token.expiration=${JWT_EXPIRATION:900000}
api.security.refresh-token.expiration=${REFRESH_TOKEN_EXPIRATION:604800000}
api.security.cookie.secure=${COOKIE_SECURE:false}
api.security.cookie.same-site=${COOKIE_SAME_SITE:Lax}
api.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.security.cpf-pepper=${CPF_PEPPER:}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
app.security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.security.rate-limit.max-requests=${RATE_LIMIT_MAX_REQUESTS:30}
app.security.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
app.legal.terms-version=2026-11
app.legal.privacy-version=2026-11

# Provisionamento opcional de conta ADMIN inicial
app.admin.seed.name=${ADMIN_SEED_NAME:Administrador PsiqueUp}
app.admin.seed.email=${ADMIN_SEED_EMAIL:}
app.admin.seed.password=${ADMIN_SEED_PASSWORD:}
app.admin.seed.clinic-name=${ADMIN_SEED_CLINIC_NAME:Consultório PsiqueUp}
app.admin.seed.clinic-cnpj=${ADMIN_SEED_CLINIC_CNPJ:11222333000181}

