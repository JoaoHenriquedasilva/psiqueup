spring.application.name=psiqueup-api
server.port=8080

# Conexão com o PostgreSQL local (Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/psiqueup_db
spring.datasource.username=psiqueup_user
spring.datasource.password=psiqueup_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA (apenas valida se as entidades batem com o SQL do Flyway)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway (controle de versao do banco)
spring.flyway.enable=true
spring.flyway.locations=classpath:db/migration




