services:
  postgres:
    image: postgres:16-alpine
    container_name: psiqueup-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: psiqueup_db
      POSTGRES_USER: psiqueup_user
      POSTGRES_PASSWORD: psiqueup_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: